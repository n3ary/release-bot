# ----------------------------------------------------------------------------
# [release] automated releases via release-please
#
# Replaces the manual "cut tag + write release notes" workflow that
# had lapsed repeatedly (v0.2.0 was a draft for 2 days, v0.2.1 was
# tagged with the wrong version in package.json, v0.3.0 had no tag
# or release until the backfill commit).
#
# How release-please works on this repo:
#   1. On every push to main, release-please looks at commits since
#      the latest release tag. If any are feat: / fix: / perf: / refactor:
#      (i.e. release-worthy per Conventional Commits), it opens or
#      updates a "chore(main): release X.Y.Z" PR.
#   2. The release PR contains:
#        - package.json#version bump (semver, inferred from commits:
#          feat: -> minor, fix: -> patch, feat!:/BREAKING CHANGE: -> major)
#        - CHANGELOG.md update (auto-generated from commit messages)
#   3. User reviews the release PR and merges it.
#   4. The release-please action sees its own push to main, cuts the
#      tag, and creates the GitHub Release with the changelog.
#
# The deploy workflow (`.github/workflows/deploy.yml`) already runs
# on every push to main, so the merge in step 3 ALSO deploys the new
# version. Order: deploy first (picks up the bumped version), then
# release-please stamps the release. This is fine -- the deploy
# itself is idempotent, and the version that ships is the one in
# the release notes.
#
# Self-bump guard interaction: the n3ary-release-bot is wired to
# ignore its own repo (see src/index.ts "Skipping self-bump"), so
# the bot will NOT also try to bump this repo's package.json. Only
# release-please touches the version on this repo.
#
# Why release-please and not a custom workflow:
#   - Generates proper CHANGELOG.md from Conventional Commits (the
#     bot's commit history is already conventional-commits style)
#   - Standard tooling, well-known behavior, less code to maintain
#   - Works on the free GitHub plan (just needs `contents: write`
#     and `pull-requests: write` on the GITHUB_TOKEN)
#
# Permissions:
#   contents: write       - cut tag, push commits to release PR branch
#   pull-requests: write  - open/update the release PR
#   id-token: not needed  (no npm publish; release-bot is private)
# ----------------------------------------------------------------------------
name: '[release] automated releases via release-please'

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One release-please run at a time. If two pushes land back-to-back
  # (e.g. a release PR merge followed by a normal PR merge), the
  # first run is allowed to complete (cancel-in-progress: false) so
  # the tag is cut before the second run's "open a new release PR"
  # logic reads the just-cut tag.
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          # package-name MUST match the `name` field in package.json.
          # release-please uses this to know which package.json to
          # update and which tag prefix to look for.
          package-name: n3ary-release-bot
          # Default behavior (no `command:` needed):
          #   - On push from a non-release-please actor: open/update
          #     the release PR.
          #   - On push from the release-please bot itself (i.e. a
          #     release PR was just merged): cut the tag and create
          #     the GitHub Release.
          # The action's default handles both cases correctly.
          #
          # token: defaults to ${{ secrets.GITHUB_TOKEN }} which
          # has contents: write + pull-requests: write from the
          # workflow's permissions: block above. No PAT needed.
